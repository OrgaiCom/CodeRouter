# ============================================================
# CodeRouter providers.yaml — llama.cpp / vllm ローカル推論サンプル
# 【カテゴリ】 llama.cpp / vLLM ＋ Launcher（Ollama 不要）
#
# このファイルは以下を想定した最小構成です:
#   - llama.cpp (llama-server) でモデルを起動
#   - または vllm でモデルを起動
#   - Launcher UI (/launcher) で起動・管理
#
# 使い方:
#   1. cp examples/providers.llamacpp-vllm.yaml ~/.coderouter/providers.yaml
#   2. 必要に応じてパス・ポートを編集
#   3. coderouter serve
#   4. http://localhost:8088/launcher でモデルを起動
#   5. 起動後は自動的に CodeRouter がルーティングを引き受ける
#
# ============================================================

# ── プロバイダ定義 ────────────────────────────────────────────────────────────
#
# Launcher で起動したサーバーを CodeRouter のプロバイダとして登録します。
# ポート番号は /launcher の Launch フォームで指定したものと合わせてください。

providers:
  # llama.cpp (llama-server) を 8080 で起動した場合
  - name: llama-cpp-local
    kind: openai_compat
    base_url: http://localhost:8080/v1
    model: ""            # llama-server は model 名を気にしないので空 or ファイル名ベースで OK
    timeout_s: 120

  # vllm を 8081 で起動した場合
  - name: vllm-local
    kind: openai_compat
    base_url: http://localhost:8081/v1
    model: ""            # vllm: --model に渡したモデル名 or HuggingFace repo ID を記入
    timeout_s: 120

# ── プロファイル定義 ──────────────────────────────────────────────────────────

profiles:
  # llama.cpp のみ使うプロファイル
  - name: local-llama
    providers: [llama-cpp-local]

  # vllm のみ使うプロファイル
  - name: local-vllm
    providers: [vllm-local]

  # llama.cpp をメイン、vllm をフォールバックにするプロファイル
  - name: default
    providers: [llama-cpp-local, vllm-local]

default_profile: default

# ── Launcher 設定 ─────────────────────────────────────────────────────────────
#
# /launcher UI でモデルを起動するための設定です。
# ここで定義したオプションプロファイルが Launch フォームのドロップダウンに表示されます。

launcher:

  # モデルファイルのスキャン対象ディレクトリ
  # .gguf / .safetensors / .bin / .pt / .ggml を再帰的に検索します
  model_dirs:
    - ~/models
    # - ~/Downloads
    # - /Volumes/External/gguf

  # バイナリパス設定 (PATH に入っている場合は省略可)
  backends:
    llama.cpp:
      binary: null          # null = PATH の llama-server を使用
      # binary: ~/llama.cpp/build/bin/llama-server   # ソースビルド例
    vllm:
      binary: null          # null = PATH の python を使用
      # binary: ~/.venv/bin/python                    # venv 例

    # ── 特化ビルドの切り替え (v2.11.0+) ────────────────────────────────
    # llama.cpp を GPU ランタイム別にビルドしてあるなら、"<基底名>-<バリアント>"
    # のキーで登録すると「バックエンド」セレクトに増え、起動ごとに選べます。
    # デバイス ID はビルドごとに別 (CUDA0 と Vulkan0 は同じ GPU ではない) なので、
    # 切り替えるとデバイス選択は自動でクリアされます。
    #
    # ★ バリアントは binary 必須。省略すると PATH の llama-server に落ちて
    #   「CUDA ビルドを指定したつもりで素のビルドが動く」事故になるため、
    #   設定ロード時にエラーにしています。
    #
    # ★ 対応ランタイム (CUDA Toolkit / Vulkan ランタイム + ICD / ROCm) は
    #   自分で導入してください。CodeRouter は導入も事前検査もしません。
    #
    # 書かなければセレクトは従来どおり 3 択のままです。
    #
    # llama.cpp-cuda:
    #   binary: ~/llm/apps/llama.cpp/build-cuda/bin/llama-server
    # llama.cpp-vulkan:
    #   binary: ~/llm/apps/llama.cpp/build-vulkan/bin/llama-server
    # llama.cpp-rocm:
    #   binary: ~/llm/apps/llama.cpp/build-rocm/bin/llama-server

  option_profiles:

    # ⚠ context size の既定について
    #   Claude Code は毎ターン 15〜35K tokens の system prompt + 会話を送ります。
    #   ctx-size / max-model-len が小さいと llama.cpp / vLLM が
    #   "exceed_context_size_error (400)" を返し、CodeRouter からは provider-failed
    #   → 502 になります。そのため Claude Code 用途では既定を 32768 以上にしています。
    #   （4096 では Claude Code の system prompt がそもそも入りません）
    #   モデルの素の対応長を超える場合は YaRN 等の rope 拡張が必要です。
    #   VRAM/メモリが厳しいときだけ「VRAM 節約」プロファイルを選んでください。

    # ⚠ -ngl (GPU オフロード層数) について
    #   **バックエンドを選んでも -ngl が 0 ならモデルは GPU に載りません。**
    #   "--device ROCm0" を指定していても -ngl 0 なら計算は CPU で走り、
    #   tok/s は CPU 性能の値になります (実測: Radeon 8060S で -ngl 0 のまま
    #   計測してしまい、Vulkan(-ngl 99) との比較が「CPU vs GPU」になっていた)。
    #   GPU で回すつもりなら必ず -ngl 99 を指定してください。
    #   ※ プロファイル名は基底 llama.cpp とバリアントで**一致させると差し替え**に
    #     なります。GPU ビルド側で同名プロファイルを上書きしておくと、
    #     取り違えても GPU 前提の値が入るので事故を防げます (下の例を参照)。

    # ── llama.cpp オプションプロファイル ──────────────────────────────────────
    llama.cpp:

      # 名前にバックエンドを含めない: llama.cpp-cuda / -vulkan / -rocm 側で
      # 同名のまま --device 等を足して上書きできるようにするため。
      - name: "GPU フル活用"
        args:
          "-ngl": 99
          "--ctx-size": 65536     # Claude Code(~35K)も余裕。VRAM に応じて 32768〜131072
          "--threads": 4
          "--batch-size": 512

      # バックエンド間 (CUDA / Vulkan / ROCm) を横並びで測るための固定条件。
      # 速度を出す設定ではなく、**条件を揃えること**が目的なので値は動かさない。
      #   - -ngl 99      : 全層 GPU。ここがずれると CPU 実行と比べることになる
      #   - --parallel 1 : llama.cpp の --ctx-size は全スロットの合計。並列数が
      #                    違うと 1 スロットあたりの実効 ctx が変わってしまう
      #   - --ctx-size   : 32768 = llmbench / Claude Code が通る最小ライン。
      #                    大きいほど KV キャッシュがメモリ帯域を食い、機種差が
      #                    バックエンド差に混ざるので比較用には広げない
      # バリアント側では --device だけを足して上書きしてください (デバイス ID は
      # ビルドごとに別の名前空間なので、ここには書けません)。
      - name: "ベンチ比較用 (条件固定)"
        args:
          "-ngl": 99
          "--ctx-size": 32768
          "--parallel": 1
          "--batch-size": 512
          "--ubatch-size": 512
          "--threads": 8

      - name: "GPU 控えめ (VRAM 節約)"
        args:
          "-ngl": 20
          "--ctx-size": 16384     # 小さめ。Claude Code の長い会話には不足する場合あり
          "--threads": 8

      # ⚠ GPU ビルド (cuda/vulkan/rocm) を選んでいてもこれを選べば CPU 実行です。
      #   バックエンド表示と実際の計算場所が食い違うので、比較には使わないこと。
      - name: "CPU のみ (GPU未使用・低速)"
        args:
          "-ngl": 0
          "--ctx-size": 32768     # Claude Code 最低ライン。CPU 推論は遅いので注意
          "--threads": 12
          "--mlock": true

      - name: "Apple Silicon M-series"
        args:
          "-ngl": 99          # Metal: 全レイヤー GPU
          "--ctx-size": 65536     # 統合メモリは余裕がある前提。足りなければ 32768 に
          "--threads": 6

      - name: "長コンテキスト (128K)"
        args:
          "-ngl": 99
          "--ctx-size": 131072
          "--batch-size": 1024
          "--ubatch-size": 512

      - name: "ベンチマーク用 (5並列)"
        args:
          "-ngl": 99
          "--ctx-size": 163840    # 5並列 × 各スロット 32768。VRAM に注意
          "--parallel": 5         # 同時リクエスト5本を並列処理（ベンチマーク用）
          "--batch-size": 1024

      # ── Gemma 4 専用（空出力 / empty output 対策）────────────────────────
      #   症状: gemma4:26b(-A4B) 等で patch/tool 生成タスクが
      #         "empty output" → "patch parse failed" になり quality=0。
      #   主因は **チャットテンプレート不一致**。llama-server は既定だと
      #   汎用テンプレートで <start_of_turn>/<end_of_turn> を組み立てるため、
      #   Gemma のターン境界・tool_code 表現が崩れて本文が空になりやすい。
      #   → GGUF 埋め込みの Jinja テンプレートを使う "--jinja": true が要。
      #     (テンプレートが埋め込まれていない GGUF なら
      #      "--chat-template": "gemma" を代わりに指定)
      #   サンプリングは構造化出力を安定させる控えめ設定。素の Gemma 推奨
      #   (temp 1.0 / top-k 64 / top-p 0.95) は自由記述向けで、patch 生成では
      #   低温+min-p の方が degenerate/空応答を抑えられる。
      - name: "Gemma 4 (空出力対策)"
        args:
          "-ngl": 99
          "--ctx-size": 32768     # Claude Code / patch タスクの最低ライン
          "--jinja": true         # ★最重要: 埋め込みチャットテンプレートを使う
          # "--chat-template": "gemma"  # ↑が効かない(テンプレ未埋め込み)GGUF用の代替
          "--temp": 0.6           # 構造化出力向けに低め (自由記述は 1.0 でも可)
          "--top-p": 0.9
          "--top-k": 40
          "--min-p": 0.05         # 低確率トークンを切り、空/崩れ応答を抑制
          "--threads": 6

      # 上と同じ Gemma 4 安定設定を並列ベンチ用にしたもの。
      # ctx は「並列数 × 各スロット 32768」で確保する点に注意 (4×32768=131072)。
      - name: "Gemma 4 ベンチ (4並列)"
        args:
          "-ngl": 99
          "--ctx-size": 131072    # 4並列 × 各スロット 32768。VRAM に注意
          "--parallel": 4
          "--jinja": true
          "--temp": 0.6
          "--top-p": 0.9
          "--top-k": 40
          "--min-p": 0.05
          "--batch-size": 1024

      # ※ Vulkan / ROCm 固有の設定は下の llama.cpp-vulkan / llama.cpp-rocm へ
      #   移しました。基底名に置くと CUDA ビルドの選択肢にも並んでしまうためです。

    # ── ビルド別オプションプロファイル (v2.11.0+) ─────────────────────────
    # 上の backends でバリアント (llama.cpp-cuda 等) を宣言している場合、
    # option_profiles にも同じキーを書けます。
    #
    #   * 基底名 "llama.cpp" のプロファイルは **全ビルドに継承** されます。
    #     共通設定をビルドごとに複製する必要はありません。
    #   * バリアント固有のものは継承分の **後ろ** に並びます。
    #   * name が衝突した場合はバリアント側が **継承分と同じ位置で差し替え**
    #     ます (末尾に重複を作りません)。
    #
    # ★ 継承される "ベンチ比較用 (条件固定)" は各ビルドで **--device だけを足して**
    #   上書きします。他の値 (-ngl / ctx / parallel / batch) を触ると横並び比較に
    #   ならないので動かさないでください。これで CUDA / Vulkan / ROCm を同一条件で
    #   順に起動してベンチできます (Launcher のスイープはビルド横断で回せます)。
    #
    # ★ "CPU のみ (GPU未使用・低速)" も継承されます。GPU ビルドを選んでいても
    #   選べてしまうので、名前で見分けてください (-ngl 0 = GPU に載りません)。
    #
    # llama.cpp-cuda:
    #   - name: "GPU フル活用"
    #     args:
    #       "-ngl": 99
    #       "--ctx-size": 131072       # 5090 の 32GB なら伸ばせる
    #       "--batch-size": 1024
    #       "--device": "CUDA0"        # ← id は CUDA ビルドの --list-devices が正
    #
    #   - name: "ベンチ比較用 (条件固定)"
    #     args:                        # ↓ --device 以外は基底と同一に保つこと
    #       "-ngl": 99
    #       "--ctx-size": 32768
    #       "--parallel": 1
    #       "--batch-size": 512
    #       "--ubatch-size": 512
    #       "--threads": 8
    #       "--device": "CUDA0"
    #
    #   - name: "3090 + 5090 (2枚に分割)"
    #     args:
    #       "-ngl": 99
    #       "--ctx-size": 65536
    #       "--device": "CUDA0,CUDA1"
    #       "--tensor-split": "24,32"  # VRAM 比 (24GB : 32GB)。等分だと遅い側が溢れる
    #       # ⚠ 世代混在の分割は遅い側 (3090) と GPU 間転送に律速されます。
    #       #   単体で載るモデルなら 1 枚に寄せた方が速いことが多いので要計測。
    #
    # llama.cpp-vulkan:
    #   - name: "GPU フル活用"
    #     args:
    #       "-ngl": 99
    #       "--ctx-size": 131072       # Strix Halo の統合メモリ (114GB) なら通る
    #       "--no-mmap": true          # ★Vulkan では実質必須。付け忘れると激遅
    #       "--batch-size": 2048       # プロンプト処理を稼ぐ。VRAM と相談
    #       "--ubatch-size": 512
    #       "--threads": 4             # 全層 GPU なら CPU スレッドはほぼ効かない
    #       "--device": "Vulkan2"      # ← id は Vulkan ビルドの --list-devices が正
    #
    #   - name: "ベンチ比較用 (条件固定)"
    #     args:
    #       "-ngl": 99
    #       "--ctx-size": 32768
    #       "--parallel": 1
    #       "--batch-size": 512
    #       "--ubatch-size": 512
    #       "--threads": 8
    #       "--no-mmap": true          # Vulkan の前提条件なので比較用でも付ける
    #       "--device": "Vulkan2"
    #
    # llama.cpp-rocm:
    #   - name: "GPU フル活用"
    #     args:
    #       "-ngl": 99                 # ★ここが 0 だと ROCm 表示のまま CPU 実行になる
    #       "--ctx-size": 131072       # Vulkan 側と揃えてある (比較したいなら必須)
    #       "--no-mmap": true          # APU は GPU も同じ RAM を使う。要計測だが有効なことが多い
    #       "--batch-size": 2048
    #       "--ubatch-size": 512
    #       "--threads": 4
    #       "--device": "ROCm0"        # ← id は ROCm ビルドの --list-devices が正
    #
    #   - name: "ベンチ比較用 (条件固定)"
    #     args:
    #       "-ngl": 99
    #       "--ctx-size": 32768
    #       "--parallel": 1
    #       "--batch-size": 512
    #       "--ubatch-size": 512
    #       "--threads": 8
    #       "--device": "ROCm0"
    #
    #   # ROCm は GPU の可視範囲を環境変数でも絞れます (HIP_VISIBLE_DEVICES など)。
    #   # option_profiles は CLI 引数しか渡さないので、必要なら coderouter 起動側の
    #   # 環境変数で設定してください。--device と env の両方で絞ると、--device の
    #   # 番号は「絞った後の並び」を指す点に注意 (ROCm0 が別の GPU になりえます)。
    #
    # ★ --device の id はビルドごとに別の名前空間です。CUDA0 と Vulkan0 は
    #   同じ GPU を指しません。プロファイルに --device を書くときは、その
    #   ビルドの --list-devices の出力に合わせてください (UI の「🔍 検出」で
    #   確認できます)。
    #
    # ★ --ctx-size は全スロットの合計です。--parallel N を付けると 1 スロット
    #   あたりは ctx-size / N になります (例: 131072 を 4 並列 → 各 32768)。
    #   ビルド間で --parallel が違うと実効 ctx がずれ、比較が成立しません。

    # ── vllm オプションプロファイル ───────────────────────────────────────────
    vllm:

      - name: "標準 (auto dtype)"
        args:
          "--dtype": "auto"
          "--max-model-len": 32768   # Claude Code 用。モデルの対応長以内で増減可
          "--gpu-memory-utilization": 0.85

      - name: "高速推論 (float16)"
        args:
          "--dtype": "float16"
          "--max-model-len": 32768   # 同上。長い会話は 65536 以上を検討
          "--gpu-memory-utilization": 0.90
          "--max-num-batched-tokens": 8192

      - name: "省メモリ (bitsandbytes int8)"
        args:
          "--dtype": "float16"
          "--quantization": "bitsandbytes"
          "--load-format": "bitsandbytes"
          "--max-model-len": 16384   # 省メモリ用に小さめ。Claude Code には不足する場合あり
          "--gpu-memory-utilization": 0.70

      - name: "長コンテキスト (32K)"
        args:
          "--dtype": "auto"
          "--max-model-len": 32768
          "--gpu-memory-utilization": 0.92

      - name: "マルチ GPU (tensor parallel x2)"
        args:
          "--dtype": "auto"
          "--tensor-parallel-size": 2
          "--max-model-len": 65536   # 2 GPU なら余裕。Claude Code(~35K)も収まる
          "--gpu-memory-utilization": 0.85
